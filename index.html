<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="With this web app you can save your business ideas, project ideas that you want to execute in future so you won't forget">
  <meta name="keywords" content="How can I save my ideas, where can I save my ideas for future use">
  <title>TasksFlow</title>
  <link rel="icon" href="./images/site logo.png">
  <link rel="stylesheet" href="./style.css">
   <link rel="shortcut icon" href="./site-logo.png" type="image/x-icon">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body>
  <div class="welcome-msg-wrapper">
            <p></p>
        </div>
  <section class="auth-section">
    
    <div class="login-auth-wrapper">
      <div class="logo-wrapper">

        <div class="logo-div">
          <img src="./TasksFlow Checklist Logo.png" alt="site logo" height="100%" width="100%">
        </div>

        <div class="site-name-wrapper">
          <h2>TasksFlow</h2>
          <p>premium</p>
        </div>

      </div>
      <div class="welcome-wrapper">
        <h2>Welcome Back!</h2>
        <p>Premium Tasks Dashboard</p>
      </div>

      <form class="login-form">
        <label for="loginEmail">Email</label>
        <br>
        <div class="input-wrapper login-email-error">
          <i class="bi bi-envelope"></i>
          <input type="email" name="email" id="loginEmail" placeholder="joetech11@gmail.com">
        </div>
        <span class="login-email-message"></span>
        <br>
        <label for="loginPassword">Password</label>
        <br>
        <div class="input-wrapper login-password-error">
          <i class="bi bi-key"></i>
          <input type="password" name="password" id="loginPassword" placeholder="Enter Your Password">
          <i class="bi bi-eye-slash password-toggle" data-target="loginPassword"></i>
        </div>
        <span class="login-password-message"></span>
        <br>
        <br>
        <button type="submit">
          <span class="login-text">
            <i class="fas fa-arrow-right"></i>
            &nbsp;Login
          </span>
          <span class="loader"></span>
        </button>
      </form>

      <p>New To TasksFlow?</p>
      <br>
      <button type="button" class="sign-up-btn" onclick="showsignup()">
        Sign Up
      </button>
    </div>

    <div class="sign-up-auth-wrapper">
      <div class="logo-wrapper">
        <div class="logo-div">
          <img src="./TasksFlow Checklist Logo.png" alt="site logo" width="100%" height="100%
          ">
        </div>
        <div class="site-name-wrapper">
          <h2>TasksFlow</h2>
          <p>premium</p>
        </div>
      </div>

      <div class="welcome-wrapper">
        <h2>Welcome To TasksFlow</h2>
        <p>Sign Up to continue to Premium Task Dashboard</p>
      </div>

      <form class="sign-up-form">
        <label for="FullName">Full Name</label>
        <br>

        <div class="input-wrapper signUp-name-error">

          <i class="bi bi-person-fill"></i>

          <input type="text" name="FullName" id="FullName" placeholder="Joe Tech">

        </div>
        <span class="signup-name-message"></span>
        <br>
        <label for="signUpEmail">Email</label>
        <br>

        <div class="input-wrapper signUp-email-error">

          <i class="bi bi-envelope"></i>

          <input type="email" name="email" id="signUpEmail" placeholder="joetech11@gmail.com">

        </div>
        <span class="email-message"></span>
        <br>

        <label for="signUpPassword">Password</label>
        <br>
        <div class="input-wrapper signUp-password-error">
          <i class="bi bi-key"></i>

          <input type="password" name="password" id="signUpPassword" placeholder="Enter Your Password">

          <i class="bi bi-eye-slash password-toggle" data-target="signUpPassword"></i>

        </div>

        <span class="password-strength"></span>

        <br>
        <button type="submit">

          <span class="login-text">

            <i class="fas fa-arrow-right"></i>
            &nbsp;Sign Up

          </span>
          <span class="loader"></span>
        </button>
      </form>
      <p>Already Have an Account?</p>

      <br>

      <button type="button" class="login-btn" onclick="showlogin()">
        Login

      </button>
    </div>
  </section>

  <!-- biggiboy11@gmail.com
   09013378503@joe -->

  <script src="./app.js"></script>
</body>

</html>
